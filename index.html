<html lang="fa" dir="rtl" data-t="dark">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; connect-src https://danyalcode-hosting-api.12345667890ass.workers.dev https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'none'; form-action 'self'; object-src 'none'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DanyalCode Hosting</title>
<link href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{--bg:#0d1117;--hd:#010409;--sf:#161b22;--ln:#30363d;--tx:#e6edf3;--mu:#8b949e;--lk:#4493f8;--gn:#238636;--gh:#2ea043;--rd:#f85149;--or:#f78166;--hv:#1c2128}
[data-t=light]{--bg:#fff;--hd:#f6f8fa;--sf:#f6f8fa;--ln:#d0d7de;--tx:#1f2328;--mu:#656d76;--lk:#0969da;--gn:#1f883d;--gh:#1a7f37;--rd:#cf222e;--or:#fd8c73;--hv:#eaeef2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 Vazirmatn,system-ui,sans-serif}
a{color:var(--lk);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.hd{display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--hd);border-bottom:1px solid var(--ln)}.hd .lg{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:15px}.crumb{color:var(--mu)}.crumb a{color:var(--tx)}.sp{flex:1}
.ib,.av{width:32px;height:32px;border:1px solid var(--ln);border-radius:6px;display:grid;place-items:center;color:var(--tx);background:none;font-size:18px;cursor:pointer}.av{border-radius:50%;font:700 13px Vazirmatn;background:var(--lk);color:#fff;border:0}
.dd{position:relative}.mn{position:absolute;inset-inline-end:0;top:40px;min-width:220px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px 0;z-index:9;box-shadow:0 8px 24px #010409aa}.mn a,.mn .mi{display:block;padding:6px 16px;color:var(--tx)}.mn a:hover{background:var(--hv);text-decoration:none}.mi{color:var(--mu)!important;border-bottom:1px solid var(--ln);margin-bottom:4px;word-break:break-all}
.tabs{display:flex;gap:6px;padding:0 24px;background:var(--hd);border-bottom:1px solid var(--ln);overflow:auto}.tabs a{padding:10px 12px;color:var(--tx);border-bottom:2px solid transparent;white-space:nowrap}.tabs a:hover{text-decoration:none;background:var(--hv);border-radius:6px 6px 0 0}.tabs a.on{border-color:var(--or);font-weight:700}
.wr{max-width:1280px;margin:0 auto;padding:24px}h1{font-size:24px;font-weight:600;margin:0 0 8px}h2{font-size:20px;font-weight:600;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--ln)}h3{font-size:14px;margin:0 0 8px}.mu{color:var(--mu)}
.bt{display:inline-flex;align-items:center;gap:6px;padding:5px 16px;font:600 13px Vazirmatn;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:6px;cursor:pointer}.bt:hover{background:var(--hv);text-decoration:none}.bt.pr{background:var(--gn);border-color:#ffffff1a;color:#fff}.bt.pr:hover{background:var(--gh)}.bt.dg{color:var(--rd)}.bt.dg:hover{background:var(--rd);color:#fff}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:5px 12px;min-width:0}input:focus,textarea:focus{outline:2px solid var(--lk);outline-offset:-1px}
.bx{border:1px solid var(--ln);border-radius:6px;overflow:hidden;margin-bottom:16px}.bx.rd{border-color:var(--rd)}.bh{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--ln);flex-wrap:wrap}.rw{display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:1px solid var(--ln);color:var(--tx)}.bh+.rw,.bx>.rw:first-child{border-top:0}a.rw:hover{background:var(--hv);text-decoration:none}.rw .g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rw small{color:var(--mu)}
.pill{border:1px solid var(--ln);color:var(--mu);border-radius:99px;padding:0 8px;font-size:12px}.pill.ok{color:#3fb950;border-color:#3fb95066}.pill.er{color:var(--rd);border-color:#f8514966}
.hm{display:grid;grid-template-columns:270px 1fr 300px;gap:24px}.rv{display:grid;grid-template-columns:1fr 296px;gap:24px}.st{display:grid;grid-template-columns:240px 1fr;gap:32px}@media(max-width:1000px){.hm,.rv,.st{grid-template-columns:1fr}}
.ls{list-style:none;margin:8px 0;padding:0}.ls a{display:flex;gap:8px;align-items:center;padding:4px 0;color:var(--tx)}.dot{width:20px;height:20px;border-radius:50%;background:var(--lk);color:#fff;font-size:11px;display:grid;place-items:center;flex:none}
.sn a{display:block;padding:6px 12px;border-radius:6px;color:var(--tx)}.sn a.on{background:var(--hv);font-weight:700;box-shadow:inset -3px 0 var(--or)}.sn a:hover{background:var(--hv);text-decoration:none}
textarea.cd{width:100%;height:420px;font:13px/1.6 ui-monospace,Menlo,monospace;border:0;border-radius:0;resize:vertical;display:block;direction:ltr}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.fld{display:block;margin:0 0 16px}.fld b{display:block;margin-bottom:6px}.fld input{width:100%;max-width:440px}.ltr{direction:ltr;text-align:left}
.dz{border:2px dashed var(--ln);border-radius:8px;padding:40px;text-align:center;margin-bottom:16px}.dz.on{border-color:var(--lk)}
.lgn{max-width:320px;margin:40px auto;text-align:center}.lgn .bx{padding:16px;text-align:start;background:var(--sf)}.lgn input{width:100%;margin:6px 0 14px}.lgn .bt{width:100%;justify-content:center;padding:8px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 12px;border-bottom:1px solid var(--ln);text-align:start}
#toast{position:fixed;bottom:18px;inset-inline:0;text-align:center;pointer-events:none;z-index:20}#toast span{background:var(--sf);border:1px solid var(--lk);padding:8px 18px;border-radius:99px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script src="jszip.min.js"></script>
<script>
const CFG = {
API_URL: "https://danyalcode-hosting-api.12345667890ass.workers.dev",
TURNSTILE_SITEKEY: "" // اختیاری: Site Key کلودفلر Turnstile را اینجا بگذارید
};
const $ = s => document.querySelector(s);
const stop = m => { document.body.style.background = '#0d1117'; document.body.innerHTML = `<div dir="rtl" style="max-width:600px;margin:12vh auto;padding:20px;font:16px/2 Vazirmatn,Tahoma,sans-serif;color:#e6edf3">${m}</div>`; throw new Error('stopped'); };
if (typeof JSZip === 'undefined') stop('<b>کتابخانه‌های لازم بارگذاری نشدند.</b><br>فایل jszip.min.js باید کنار index.html باشد.');
if (!CFG.API_URL) stop('<b>تنظیمات پنل کامل نیست.</b><br>در همین فایل، خط API_URL را با آدرس سرور پر کنید.');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const TEXT = /\.(html?|css|m?js|json|txt|md|xml|svg|map|webmanifest|csv)$|(^|\/)(_headers|_redirects)$/i;
const IMG = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', ico: 'image/x-icon', avif: 'image/avif' };
const IC = { f: '<path d="M2 4h4l1.5 1.5H14v7H2z"/>', d: '<path d="M4 2h5l3 3v9H4z M9 2v3h3"/>', b: '<circle cx="5" cy="3.5" r="1.5"/><circle cx="5" cy="12.5" r="1.5"/><circle cx="11" cy="6" r="1.5"/><path d="M5 5v6M11 7.5C11 10 5 9 5 11"/>', h: '<path d="M8 4v4l2.5 1.5"/><circle cx="8" cy="8" r="6"/>', k: '<path d="M3 8.5l3 3 7-7"/>' };
const ic = (n, c = '') => `<svg class="i" style="${c}" viewBox="0 0 16 16">${IC[n]}</svg>`;
const LOGO = '<svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#4493f8"/><path d="M12 11l-5 5 5 5M20 11l5 5-5 5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let S = { me: null, list: [], base: '', q: '' }, tt;
const toast = m => { $('#toast').innerHTML = `<span>${esc(m)}</span>`; clearTimeout(tt); tt = setTimeout(() => $('#toast').innerHTML = '', 4500) };
const fail = e => { toast(e.message || 'خطا'); console.error(e) };
const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1024).toFixed(1) + ' KB';
const ago = t => { const s = (new Date(t) - Date.now()) / 1000, r = new Intl.RelativeTimeFormat('fa', { numeric: 'auto' }); for (const [u, n] of [['year', 31536e3], ['month', 2592e3], ['week', 6048e2], ['day', 864e2], ['hour', 3600], ['minute', 60]]) if (Math.abs(s) >= n) return r.format(Math.round(s / n), u); return 'همین حالا' };
const host = p => p.host;
const ST = { success: 'موفق', failure: 'ناموفق', active: 'در حال انجام', idle: 'در انتظار', canceled: 'لغو شد', skipped: 'رد شد' }, st = x => ST[x] || x || '-';
const STG = { queued: 'در صف', initialize: 'آماده‌سازی', clone_repo: 'دریافت فایل‌ها', build: 'ساخت', deploy: 'انتشار' }, stg = x => STG[x] || x || '-';
async function api(p, m = 'GET', b) {
  const r = await fetch(CFG.API_URL + p, { method: m, headers: { authorization: 'Bearer ' + (localStorage.tk || ''), 'content-type': 'application/json' }, body: b ? JSON.stringify(b) : undefined });
  const d = await r.json().catch(() => ({})); if (r.status === 401 && localStorage.tk) { localStorage.removeItem('tk'); S.me = null; authView() } if (!r.ok) throw new Error(d.error || 'خطا در ارتباط با سرور'); return d;
}
async function load(force) { if (S.me && !force) return; const d = await api('/api/projects'); S.me = d.me; S.list = d.projects; S.base = d.base; S.total = d.total; S.limit = d.limit }
function theme() { const e = document.documentElement; e.dataset.t = e.dataset.t === 'dark' ? 'light' : 'dark'; localStorage.t = e.dataset.t }
if (localStorage.t) document.documentElement.dataset.t = localStorage.t;
document.addEventListener('click', () => document.querySelectorAll('[data-m]').forEach(m => m.hidden = true));
const menu = (e, id) => { e.stopPropagation(); const m = $('#' + id), h = m.hidden; document.querySelectorAll('[data-m]').forEach(x => x.hidden = true); m.hidden = !h };
function shell(x, p, tab) {
  const nm = S.me?.is_admin ? 'admin' : (S.me?.phone || ''), r = p ? '#/r/' + p.id : '';
  $('#app').innerHTML = `<header class="hd"><a class="lg" href="#/">${LOGO}<b>DanyalCode</b></a>${p ? `<span class="crumb ltr"><a href="#/">${esc(nm)}</a> / <a href="${r}"><b>${esc(p.name)}</b></a></span>` : ''}<span class="sp"></span><a class="ib" href="#/new" title="سایت جدید">+</a><div class="dd"><button class="av" onclick="menu(event,'mn')">${esc(S.me?.is_admin ? 'A' : nm.slice(-2))}</button><div class="mn" id="mn" data-m hidden><div class="mi ltr">${esc(S.me?.is_admin ? 'مدیر' : S.me?.phone)}</div><a href="#/">پروژه‌های من</a><a onclick="theme()">تغییر تم</a><a onclick="logout()">خروج</a></div></div></header>${p ? `<nav class="tabs">${[['', 'کد'], ['/deployments', 'انتشارها'], ['/settings', 'تنظیمات']].map(([k, v]) => `<a class="${tab === k ? 'on' : ''}" href="${r}${k}">${v}</a>`).join('')}</nav>` : ''}<main class="wr">${x}</main>`;
}
let A = { phone: '', t: 0 }, tm;
const dg = s => String(s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function authView(step = 'phone') {
  clearInterval(tm);
  const logo = `<div style="margin:24px 0 16px">${LOGO.replace('30', '48').replace('30', '48')}</div><h1 style="font-weight:300;text-align:center">ورود به DanyalCode</h1>`;
  const f = {
    phone: `<form class="bx" onsubmit="sendCode();return false"><label>شماره موبایل</label><input id="ph" type="tel" inputmode="numeric" class="ltr" placeholder="09123456789" value="${esc(A.phone)}" autofocus><div id="ts" style="margin:10px 0"></div><button class="bt pr">دریافت کد تایید</button><p class="mu" style="margin:12px 0 0;font-size:12px">با ورود، حساب شما به‌طور خودکار ساخته می‌شود.</p></form>`,
    code: `<form class="bx" onsubmit="verify();return false"><label>کد تایید ارسال‌شده به <b class="ltr">${esc(A.phone)}</b></label><input id="cd" type="tel" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="ltr" autofocus><button class="bt pr">ورود</button><div id="ts" style="margin-top:12px"></div><div class="row" style="justify-content:space-between;margin-top:12px"><a onclick="authView('phone')">ویرایش شماره</a><button type="button" class="bt" id="rs" onclick="sendCode(1)" disabled></button></div></form>`
  };
  $('#app').innerHTML = `<div class="lgn">${logo}${f[step]}</div>`;
  if (step === 'code') tick();
  mountTs();
}
let tsId = null;
function mountTs() {
  tsId = null; A.ts = '';
  const k = CFG.TURNSTILE_SITEKEY, el = $('#ts'); if (!k || !el) return;
  const go = () => { tsId = turnstile.render(el, { sitekey: k, callback: t => { A.ts = t }, 'expired-callback': () => { A.ts = '' } }) };
  if (window.turnstile) go(); else { const c = document.createElement('script'); c.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; c.async = true; c.onload = go; document.head.appendChild(c) }
}
function tick() {
  clearInterval(tm); const b = $('#rs'); if (!b) return;
  const f = () => { const s = Math.max(0, Math.ceil((A.t - Date.now()) / 1000)); b.disabled = s > 0; b.textContent = s > 0 ? `ارسال دوباره (${s})` : 'ارسال دوباره کد'; if (!s) clearInterval(tm) };
  f(); tm = setInterval(f, 1000);
}
async function sendCode(again) {
  const ph = again ? A.phone : dg($('#ph').value).trim();
  if (CFG.TURNSTILE_SITEKEY && !A.ts) return toast('چند ثانیه صبر کنید تا تأیید امنیتی کامل شود');
  try { await api('/api/auth/send', 'POST', { phone: ph, ts: A.ts }); A.phone = ph; A.t = Date.now() + 120000; toast('کد تایید ارسال شد'); authView('code') } catch (e) { fail(e); try { if (window.turnstile && tsId !== null) turnstile.reset(tsId) } catch {} A.ts = '' }
}
async function verify() {
  try { const d = await api('/api/auth/verify', 'POST', { phone: A.phone, code: dg($('#cd').value).trim() }); localStorage.tk = d.token; S.me = null; await load(); router() } catch (e) { fail(e) }
}
const logout = async () => { try { await api('/api/auth/logout', 'POST', {}) } catch {} localStorage.removeItem('tk'); S.me = null; authView() };

async function router() {
  const m = decodeURIComponent(location.hash.slice(1)).split('/').filter(Boolean);
  try {
    await load();
    if (m[0] === 'new') return newRepo();
    if (m[0] === 'r') {
      const p = S.list.find(x => x.id === m[1]); if (!p) return home();
      const sec = m[2] || '', rest = m.slice(3).join('/'); S.p = p;
      if (!sec) return code(p, ''); if (sec === 'tree') return code(p, rest); if (sec === 'blob') return blob(p, rest);
      if (sec === 'upload') return upload(p, rest); if (sec === 'new') return newFile(p, rest); if (sec === 'commits') return commits(p);
      if (sec === 'deployments') return deps(p); if (sec === 'settings') return settings(p, m[3] || 'general');
    }
    home();
  } catch (e) { fail(e) }
}
function home() {
  const mine = S.list.length, max = S.me.max_sites;
  shell(`<div class="hm"><aside><div class="row" style="justify-content:space-between"><b>پروژه‌های برتر</b><a class="bt pr" href="#/new">+ جدید</a></div><input id="fq" placeholder="جستجوی پروژه…" style="width:100%" value="${esc(S.q)}" oninput="S.q=this.value;fl()"><ul class="ls" id="rl"></ul></aside>
<section><h2>سایت‌های شما</h2><div class="bx">${S.list.map(p => `<a class="rw" href="#/r/${p.id}">${ic('f', 'color:#54aeff')}<span class="g"><b>${esc(p.name)}</b><br><small class="ltr" style="display:block">${esc(host(p))}</small></span><small>${ago(p.created_at)}</small></a>`).join('') || `<div class="rw" style="flex-direction:column;padding:40px;text-align:center"><h3>هنوز سایتی نساخته‌اید</h3><span class="mu">اولین سایت استاتیک خود را بسازید و فایل‌های HTML و CSS و JS را آپلود کنید.</span><br><a class="bt pr" href="#/new">ساخت سایت</a></div>`}</div></section>
<aside><div class="bx"><div class="bh"><b>مصرف شما</b></div><div class="rw" style="display:block"><div>${mine} از ${max} سایت مجاز</div>${S.me.is_admin ? `<div class="mu">کل سایت‌های پلتفرم: ${S.total} از ${S.limit}</div>` : ''}</div></div></aside></div>`);
  fl();
}
function fl() { const q = S.q.toLowerCase(); $('#rl').innerHTML = S.list.filter(p => p.name.toLowerCase().includes(q) || p.sub.includes(q)).map(p => `<li><a href="#/r/${p.id}"><span class="dot">${esc(p.name[0] || '?').toUpperCase()}</span>${esc(p.name)}</a></li>`).join('') || '<li class="mu">موردی نیست</li>' }
function newRepo() {
  shell(`<div style="max-width:700px;margin:0 auto"><h1>ساخت سایت جدید</h1><p class="mu">هر سایت یک آدرس مستقل دارد. ${S.list.length} از ${S.me.max_sites} سایت مجاز شما استفاده شده است.</p><hr style="border:0;border-top:1px solid var(--ln)"><form onsubmit="mk(event)"><label class="fld"><b>نام پروژه *</b><input name="name" required></label><label class="fld"><b>نام در آدرس *</b><span class="row"><input name="sub" class="ltr" placeholder="portfolio" required style="max-width:240px"><span class="mu ltr">.pages.dev</span></span></label><hr style="border:0;border-top:1px solid var(--ln)"><button class="bt pr" id="mkb">ساخت سایت</button></form></div>`);
}
async function mk(ev) {
  ev.preventDefault(); const f = new FormData(ev.target); $('#mkb').disabled = true; toast('در حال ساخت سایت…');
  try { const p = await api('/api/projects', 'POST', { name: f.get('name'), sub: f.get('sub') }); await load(1); toast('سایت ساخته شد'); location.hash = '#/r/' + p.id } catch (e) { fail(e); $('#mkb').disabled = false }
}
const tree = async p => (await api('/api/tree?project=' + p.id)).tree;
const commit = (p, files, msg) => api('/api/commit', 'POST', { project: p.id, message: msg || 'Update', files });
async function code(p, dir) {
  shell('<p class="mu">در حال بارگذاری…</p>', p, '');
  const [t, c, d] = await Promise.all([tree(p), api('/api/commits?project=' + p.id).catch(() => []), api('/api/deployments?project=' + p.id).catch(() => [])]);
  const pre = dir ? dir + '/' : '', ds = new Set(), fs = [];
  for (const f of t) { if (!f.path.startsWith(pre)) continue; const r = f.path.slice(pre.length), i = r.indexOf('/'); if (i < 0) fs.push({ ...f, name: r }); else ds.add(r.slice(0, i)) }
  const par = dir.includes('/') ? dir.slice(0, dir.lastIndexOf('/')) : '', cr = dir.split('/').filter(Boolean);
  const l = d[0], ok = l?.status === 'success';
  shell(`<div class="rv"><div><div class="row" style="justify-content:space-between"><span class="row"><span class="mu">${ic('f')} فایل‌های سایت</span></span><div class="dd"><button class="bt pr" onclick="menu(event,'af')">افزودن فایل ▾</button><div class="mn" id="af" data-m hidden><a href="#/r/${p.id}/new/${enc(dir)}">ساخت فایل جدید</a><a href="#/r/${p.id}/upload/${enc(dir)}">آپلود فایل یا ZIP</a></div></div></div>
${dir ? `<div class="row ltr"><a href="#/r/${p.id}">${esc(p.name)}</a>${cr.map((s, i) => ` / <a href="#/r/${p.id}/tree/${enc(cr.slice(0, i + 1).join('/'))}">${esc(s)}</a>`).join('')}</div>` : ''}
<div class="bx">${c[0] ? `<div class="bh"><b class="g" style="flex:1">${esc(c[0].msg)}</b><span class="mu ltr">${c[0].sha}</span><span class="mu">${ago(c[0].at)}</span><a href="#/r/${p.id}/commits">${ic('h')} ${c.length}${c.length >= 30 ? '+' : ''} نسخه</a></div>` : ''}
${dir ? `<a class="rw" href="#/r/${p.id}${par ? '/tree/' + enc(par) : ''}">${ic('f', 'color:#54aeff')} ..</a>` : ''}
${[...ds].sort().map(n => `<a class="rw" href="#/r/${p.id}/tree/${enc(pre + n)}">${ic('f', 'color:#54aeff')}<span class="g ltr">${esc(n)}</span></a>`).join('')}
${fs.sort((a, b) => a.name.localeCompare(b.name)).map(f => `<a class="rw" href="#/r/${p.id}/blob/${enc(f.path)}">${ic('d', 'color:var(--mu)')}<span class="g ltr">${esc(f.name)}</span><small>${kb(f.size)}</small></a>`).join('')}
${!ds.size && !fs.length ? '<div class="rw mu">این پوشه خالی است.</div>' : ''}</div></div>
<aside><h3>درباره</h3><p class="mu">سایت استاتیک شما</p><p><a class="ltr" style="display:block" target="_blank" rel="noopener" href="https://${esc(host(p))}">${esc(host(p))}</a></p><hr style="border:0;border-top:1px solid var(--ln)"><h3><a href="#/r/${p.id}/deployments" style="color:var(--tx)">انتشارها</a> <span class="pill">${d.length}</span></h3>${l ? `<p>${ic('k', ok ? 'color:#3fb950' : '')} <span class="pill ${ok ? 'ok' : l.status === 'failure' ? 'er' : ''}">${esc(st(l.status))}</span> <span class="mu">${ago(l.at)}</span></p>` : '<p class="mu">هنوز انتشاری ثبت نشده است.</p>'}</aside></div>`, p, '');
}
async function blob(p, path) {
  const t = await tree(p), f = t.find(x => x.path === path); if (!f) { toast('فایل پیدا نشد'); return history.back() }
  const ext = path.split('.').pop().toLowerCase(), dir = path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '', txt = TEXT.test(path);
  const b64 = (await api(`/api/blob?project=${p.id}&sha=${f.sha}`)).content.replace(/\n/g, ''); S.path = path; S.dir = dir;
  const body = txt ? `<textarea class="cd" id="tx" spellcheck="false">${esc(new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))))}</textarea>` : IMG[ext] ? `<div style="padding:16px;text-align:center"><img style="max-width:100%" src="data:${IMG[ext]};base64,${b64}"></div>` : '<div class="rw mu">پیش‌نمایش این نوع فایل ممکن نیست.</div>';
  shell(`<div class="row ltr"><a href="#/r/${p.id}">${esc(p.name)}</a> / <b>${esc(path)}</b></div><div class="bx"><div class="bh"><b class="ltr">${esc(path.split('/').pop())}</b><span class="mu">${kb(f.size)}</span></div>${body}</div>
<div class="bx"><div class="bh"><b>ذخیره تغییرات</b></div><div class="rw" style="display:block"><input id="cm" style="width:100%;max-width:600px" value="${txt ? 'ویرایش ' : ''}${esc(path.split('/').pop())}"><div class="row">${txt ? '<button class="bt pr" onclick="doSave()">ذخیره تغییرات</button>' : ''}<button class="bt dg" onclick="doDel()">حذف فایل</button><a class="bt" href="#/r/${p.id}${dir ? '/tree/' + enc(dir) : ''}">انصراف</a></div></div></div>`, p, '');
}
const back = () => location.hash = '#/r/' + S.p.id + (S.dir ? '/tree/' + enc(S.dir) : '');
async function doSave() { try { await commit(S.p, [{ path: S.path, content: $('#tx').value }], $('#cm').value); toast('ذخیره شد؛ انتشار در حال انجام است'); back() } catch (e) { fail(e) } }
async function doDel() { if (!confirm('حذف ' + S.path + '؟')) return; try { await commit(S.p, [{ path: S.path, delete: true }], 'حذف ' + S.path); toast('حذف شد'); back() } catch (e) { fail(e) } }
function newFile(p, dir) {
  S.dir = dir; shell(`<h1>ساخت فایل جدید</h1><div class="row"><input id="nf" class="ltr" style="flex:1;max-width:500px" placeholder="نام فایل، مثل index.html" value="${esc(dir ? dir + '/' : '')}"></div><div class="bx"><textarea class="cd" id="tx" spellcheck="false"></textarea></div><input id="cm" style="width:100%;max-width:600px" value="ساخت فایل"><div class="row"><button class="bt pr" onclick="doNew()">ذخیره تغییرات</button><a class="bt" href="#/r/${p.id}">انصراف</a></div>`, p, '');
}
async function doNew() { const n = $('#nf').value.trim(); if (!TEXT.test(n)) return toast('پسوند فایل باید متنی باشد (html, css, js, …)'); try { await commit(S.p, [{ path: n, content: $('#tx').value }], $('#cm').value); toast('فایل ساخته شد'); back() } catch (e) { fail(e) } }
function upload(p, dir) {
  S.dir = dir; shell(`<h1>آپلود فایل</h1><p class="mu">فایل‌ها یا یک ZIP را بکشید. ZIP خودکار باز می‌شود.${dir ? ' مقصد: ' + esc(dir) : ''}</p><div class="dz" id="dz"><p>فایل‌ها را اینجا رها کنید یا انتخاب کنید</p><input type="file" id="up" multiple onchange="$('#cnt').textContent=this.files.length+' فایل انتخاب شد'"><p class="mu" id="cnt"></p></div><input id="cm" style="width:100%;max-width:600px" value="آپلود فایل"><div class="row"><button class="bt pr" onclick="doUp()">ذخیره تغییرات</button><a class="bt" href="#/r/${p.id}${dir ? '/tree/' + enc(dir) : ''}">انصراف</a></div>`, p, '');
  const z = $('#dz'); z.ondragover = e => { e.preventDefault(); z.classList.add('on') }; z.ondragleave = () => z.classList.remove('on'); z.ondrop = e => { e.preventDefault(); $('#up').files = e.dataTransfer.files; $('#up').onchange() };
}
const rd = (f, pre) => TEXT.test(f.name) ? f.text().then(c => ({ path: pre + f.name, content: c })) : new Promise(r => { const x = new FileReader(); x.onload = () => r({ path: pre + f.name, binary: 1, content: x.result.split(',')[1] }); x.readAsDataURL(f) });
async function zipFiles(f, pre) {
  const z = await JSZip.loadAsync(f), es = Object.values(z.files).filter(e => !e.dir && !e.name.startsWith('__MACOSX') && !e.name.endsWith('.DS_Store')), top = es[0]?.name.split('/')[0], strip = es.length > 0 && es.every(e => e.name.startsWith(top + '/')), out = [];
  for (const e of es) { const path = pre + (strip ? e.name.slice(top.length + 1) : e.name), t = TEXT.test(path); out.push({ path, binary: !t, content: await e.async(t ? 'string' : 'base64') }) } return out;
}
async function push(files, msg) {
  let g = [], b = 0, z = 0, n = 0; const fl = async () => { if (g.length) { await commit(S.p, g, msg); n++; toast(`بخش ${n} ذخیره شد`); g = []; b = 0; z = 0 } };
  for (const f of files) { const l = f.content.length; if (l * .75 > 25e6) throw new Error(f.path + ' بزرگ‌تر از ۲۵ مگابایت است'); if ((f.binary && b >= 40) || z + l > 2e7 || g.length >= 300) await fl(); g.push(f); if (f.binary) b++; z += l }
  await fl();
}
async function doUp() {
  const fs = [...$('#up').files]; if (!fs.length) return toast('فایلی انتخاب نشده است'); const pre = S.dir ? S.dir + '/' : '';
  try { const all = []; for (const f of fs) all.push(...(/\.zip$/i.test(f.name) ? await zipFiles(f, pre) : [await rd(f, pre)])); toast('در حال آپلود…'); await push(all, $('#cm').value); toast('آپلود شد؛ انتشار در حال انجام است'); back() } catch (e) { fail(e) }
}
async function commits(p) {
  const c = await api('/api/commits?project=' + p.id);
  shell(`<h2>تاریخچه تغییرات</h2><div class="bx">${c.map(x => `<div class="rw"><span class="g"><b>${esc(x.msg)}</b></span><span class="mu ltr">${x.sha}</span><small>${ago(x.at)}</small></div>`).join('')}</div>`, p, '');
}
async function deps(p) {
  const d = await api('/api/deployments?project=' + p.id); S.p = p;
  shell(`<div class="row" style="justify-content:space-between"><h2 style="border:0;margin:0">انتشارها</h2><button class="bt pr" onclick="dep()">انتشار مجدد</button></div><div class="bx">${d.map(x => `<div class="rw"><span class="pill ${x.status === 'success' ? 'ok' : x.status === 'failure' ? 'er' : ''}">${esc(st(x.status))}</span><span class="g"><b>${esc(x.msg || 'بدون پیام')}</b><br><small>${x.env === 'production' ? 'اصلی' : 'آزمایشی'} / ${esc(stg(x.stage))} / ${ago(x.at)}</small></span>${x.url ? `<a target="_blank" rel="noopener" href="${esc(x.url)}">باز کردن</a>` : ''}${x.status === 'success' && x.env === 'production' ? `<button class="bt" onclick="rb('${x.id}')">بازگشت به این نسخه</button>` : ''}</div>`).join('') || '<div class="rw mu">هنوز انتشاری ثبت نشده است.</div>'}</div>`, p, '/deployments');
}
async function dep() { try { await api('/api/deploy', 'POST', { project: S.p.id }); toast('انتشار مجدد درخواست شد'); deps(S.p) } catch (e) { fail(e) } }
async function rb(id) { if (!confirm('بازگشت به این نسخه؟')) return; try { await api('/api/rollback', 'POST', { project: S.p.id, id }); toast('انجام شد'); deps(S.p) } catch (e) { fail(e) } }
async function settings(p, tab) {
  let body = '';
  if (tab === 'general') body = `<h2>عمومی</h2><label class="fld"><b>نام پروژه</b><input value="${esc(p.name)}" readonly></label><label class="fld"><b>آدرس سایت</b><input class="ltr" value="${esc(p.host)}" readonly></label><p class="mu">تغییر نام پروژه و زیردامنه پشتیبانی نمی‌شود.</p><h2 style="color:var(--rd);margin-top:40px">منطقه خطر</h2><div class="bx rd"><div class="rw" style="display:block"><b>حذف این پروژه</b><p class="mu">همه فایل‌ها و سایت برای همیشه پاک می‌شوند. برای تأیید، نام پروژه (<b class="ltr">${esc(p.sub)}</b>) را تایپ کنید.</p><div class="row"><input id="cf" class="ltr"><button class="bt dg" onclick="delp()">حذف پروژه</button></div></div></div>`;
  else {
    const [d, dm] = await Promise.all([api('/api/deployments?project=' + p.id).catch(() => []), api('/api/domain?project=' + p.id).catch(() => ({}))]), l = d[0];
    body = `<h2>انتشار</h2><div class="bx"><div class="rw"><span class="g">${l?.status === 'success' ? 'سایت شما منتشر شده است:' : 'وضعیت آخرین انتشار: ' + (l ? esc(st(l.status)) : 'هنوز انتشاری ثبت نشده')} <a class="ltr" target="_blank" rel="noopener" href="https://${esc(host(p))}">https://${esc(host(p))}</a>${l ? `<br><small>آخرین انتشار ${ago(l.at)}</small>` : ''}</span><a class="bt" target="_blank" rel="noopener" href="https://${esc(host(p))}">مشاهده سایت</a></div></div>
<p class="mu">فقط فایل‌های استاتیک پشتیبانی می‌شوند و با هر ذخیره، سایت به‌طور خودکار منتشر می‌شود.</p>
<h2 style="margin-top:32px">دامنه سفارشی</h2>${dm.hostname ? `<p><b class="ltr">${esc(dm.hostname)}</b> <span class="pill">${esc(dm.status)}</span></p>${dm.error ? `<p style="color:var(--rd)">${esc(dm.error)}</p>` : ''}<p class="mu">در DNS دامنه خود یک رکورد CNAME به <b class="ltr">${esc(dm.cname)}</b> بسازید. بعد از تأیید DNS، SSL خودکار فعال می‌شود.</p><button class="bt dg" onclick="rmDom()">حذف دامنه</button>` : `<p class="mu">فقط زیردامنه‌هایی مثل www.example.com پشتیبانی می‌شوند، نه دامنه ریشه.</p><div class="row"><input id="hn" class="ltr" placeholder="www.example.com" style="width:260px"><button class="bt pr" onclick="addDom()">ذخیره</button></div>`}`;
  }
  const r = '#/r/' + p.id + '/settings';
  shell(`<div class="st"><nav class="sn"><a class="${tab === 'general' ? 'on' : ''}" href="${r}">عمومی</a><a class="${tab === 'pages' ? 'on' : ''}" href="${r}/pages">انتشار و دامنه</a></nav><div>${body}</div></div>`, p, '/settings');
}
async function addDom() { try { await api('/api/domain', 'POST', { project: S.p.id, hostname: $('#hn').value.trim() }); await load(1); S.p = S.list.find(x => x.id === S.p.id); settings(S.p, 'pages') } catch (e) { fail(e) } }
async function rmDom() { if (!confirm('دامنه حذف شود؟')) return; try { await api('/api/domain', 'DELETE', { project: S.p.id }); await load(1); S.p = S.list.find(x => x.id === S.p.id); settings(S.p, 'pages') } catch (e) { fail(e) } }
async function delp() { try { await api('/api/project', 'DELETE', { project: S.p.id, confirm: $('#cf').value.trim() }); toast('پروژه حذف شد'); await load(1); location.hash = '#/' } catch (e) { fail(e) } }
window.addEventListener('hashchange', () => localStorage.tk && router());
localStorage.tk ? router() : authView();
</script>
